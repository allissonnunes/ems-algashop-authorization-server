logging:
  level:
    org.springframework.security: TRACE

server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/authorization_server
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
      - classpath:db/testdata
  security:
    oauth2:
      authorizationserver:
        issuer: http://auth.algashop.local:8081
        client:
          algashop-test-client:
            registration:
              client-id: algashop-test-client
              client-secret: "{noop}secret2"
              authorization-grant-types:
                - client_credentials
              client-authentication-methods:
                - client_secret_basic
              scopes:
                - products:read
                - products:write
                - products:stock:write
                - categories:read
                - categories:write

                - invoices:read
                - invoices:write
                - credit-cards:read
                - credit-cards:write

                - orders:read
                - orders:write
                - customers:read
                - customers:write
                - shopping-carts:read
                - shopping-carts:write
                - shipping-costs:preview

                - users:read
                - users:write
          algashop-ordering-service-client:
            registration:
              client-id: algashop-ordering-service
              client-secret: "{noop}secret1"
              authorization-grant-types:
                - client_credentials
              client-authentication-methods:
                - client_secret_basic
              scopes:
                - products:read
          algashop-ecommerce-web-client:
            registration:
              client-id: algashop-ecomerce-web
              client-secret: "{noop}ecommerce123"
              client-name: AlgaShop E-Commerce
              authorization-grant-types:
                - authorization_code
                - refresh_token
              client-authentication-methods:
                - client_secret_basic
              redirect-uris:
                - http://algashop.local:9080/login/oauth2/code/algashop-ecommerce-web
                - https://oauth.pstmn.io/v1/callback
              post-logout-redirect-uris:
                - http://algashop.local:9080/logoutCallback
              scopes:
                - openid
                - credit-cards:read
                - credit-cards:write
                - orders:read
                - orders:write
                - customers:read
                - customers:write
                - shopping-carts:read
                - shopping-carts:write
                - shipping-costs:preview
            require-authorization-consent: true
            require-proof-key: false
            token:
              access-token-time-to-live: 5m
              refresh-token-time-to-live: 1h
              reuse-refresh-tokens: false
          algashop-ecommerce-m2m-client:
            registration:
              client-id: algashop-ecommerce-m2m
              client-secret: "{noop}m2m123"
              client-name: AlgaShop E-Commerce
              authorization-grant-types:
                - client_credentials
              client-authentication-methods:
                - client_secret_basic
              scopes:
                - products:read
                - categories:read
                - customers:write
            token:
              access-token-time-to-live: 15m
          algashop-admin-web-client:
            registration:
              client-id: algashop-admin-web
              client-name: AlgaShop Admin
              authorization-grant-types:
                - authorization_code
              client-authentication-methods:
                - none # Client público sem autenticação
              redirect-uris:
                - http://admin.algashop.local:4200
                - http://admin.algashop.local:4200/silent-refresh.html
                - https://oauth.pstmn.io/v1/callback
              post-logout-redirect-uris:
                - http://admin.algashop.local:4200
              scopes:
                - products:read
                - products:write
                - products:stock:write
                - categories:read
                - categories:write
                - invoices:read
                - orders:read
                - customers:read
                - shopping-carts:read
                - users:read
                - users:write
                - openid
            require-authorization-consent: false
            require-proof-key: true #PKCE
            token:
              access-token-time-to-live: 5m
              authorization-code-time-to-live: 2m
  session:
    store-type: jdbc

algashop:
  security:
    cors:
      allowed-origins:
        - http://admin.algashop.local:4200
    cookie:
      secure: false
      same-site: Lax # Lax(include subdomain), Strict(only strict domain), None(any domain)
      domain-name: algashop.local
    csp:
      policy-directives: "default-src 'self'; frame-ancestors 'self' http://admin.algashop.local:4200 http://auth.algashop.local:8081;"